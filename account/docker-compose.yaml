services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: account_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d account_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  account:
    build: .
    environment:
      DATABASE_URL: postgres://user:password@db:5432/account_db?sslmode=disable
      PORT: "8080"
      ENVIRONMENT: production
      JWT_SECRET: change-me-in-production-dev-key1
      AMQP_HOST: rabbitmq
      AMQP_USER: guest
      AMQP_PASS: guest
    ports:
      - "8080:8080"
    networks:
      - default
      - services_net
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:

networks:
  services_net:
    external: true
