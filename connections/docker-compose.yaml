services:
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  connections:
    build: .
    ports:
      - "8082:8082"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: password
      JWT_SECRET: change-me-in-production-dev-key1
      M2M_SECRET: change-me-in-production-dev-key1
      AMQP_HOST: account-rabbitmq-1
      AMQP_USER: guest
      AMQP_PASS: guest
    networks:
      - default
      - services_net
    depends_on:
      neo4j:
        condition: service_healthy

networks:
  services_net:
    external: true
