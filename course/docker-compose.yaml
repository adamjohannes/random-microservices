services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: course_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d course_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/course_db
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  course:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db:5432/course_db
      JWT_SECRET: change-me-in-production
      PORT: "8080"
      ENVIRONMENT: production
      AMQP_HOST: rabbitmq
      AMQP_USER: guest
      AMQP_PASS: guest
    ports:
      - "8081:8080"
    networks:
      - default
      - services_net
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:

networks:
  services_net:
    external: true
