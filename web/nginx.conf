server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=5s;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to account service
    location /api/account/ {
        set $account_upstream http://account:8080;
        rewrite ^/api/account(/.*)$ /api/v1/accounts$1 break;
        proxy_pass $account_upstream;
        proxy_set_header Host $host;
    }

    # Proxy to course service (container listens on 8080, host maps to 8081)
    location /api/course/ {
        set $course_upstream http://course:8080;
        rewrite ^/api/course(/.*)$ $1 break;
        proxy_pass $course_upstream;
        proxy_set_header Host $host;
    }

    # Proxy to connections service
    location /api/connections/ {
        set $connections_upstream http://connections:8082;
        rewrite ^/api/connections(/.*)$ $1 break;
        proxy_pass $connections_upstream;
        proxy_set_header Host $host;
    }
}
