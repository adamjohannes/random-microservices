server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy to account service
    location /api/account/ {
        rewrite ^/api/account(/.*)$ /api/v1/accounts$1 break;
        proxy_pass http://account:8080;
        proxy_set_header Host $host;
    }

    # Proxy to course service
    location /api/course/ {
        rewrite ^/api/course(/.*)$ $1 break;
        proxy_pass http://course:8081;
        proxy_set_header Host $host;
    }

    # Proxy to connections service
    location /api/connections/ {
        rewrite ^/api/connections(/.*)$ $1 break;
        proxy_pass http://connections:8082;
        proxy_set_header Host $host;
    }
}
